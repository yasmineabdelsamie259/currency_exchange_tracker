name: currency_exchange_tracker
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  connectivity_plus: ^7.3.1
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.3.0
  go_router: ^18.0.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/licenses/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/poundwise_app_icon.png
  adaptive_icon_background: '#123F32'
  adaptive_icon_foreground: assets/images/poundwise_app_icon_foreground.png
  remove_alpha_ios: true

flutter_native_splash:
  color: '#123F32'
  color_dark: '#234E3E'
  image: assets/images/poundwise_splash_brand.png
  image_dark: assets/images/poundwise_splash_brand.png
  android: true
  ios: true
  web: false
  ios_content_mode: center
  android_12:
    color: '#123F32'
    color_dark: '#234E3E'
    image: assets/images/poundwise_splash_android12.png
    image_dark: assets/images/poundwise_splash_android12.png
